<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Desk Fan Drift</title>
<style>
html, body { margin:0; height:100%; }
* { box-sizing:border-box; }
body {
  overflow:hidden;
  background:#151921;
  color:#f8f5e9;
  font-family:Arial, Helvetica, sans-serif;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
#game {
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%, rgba(76,99,114,.28), transparent 42%),
    linear-gradient(#202730, #11151b);
}
canvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  cursor:crosshair;
}
#topbar {
  position:absolute;
  z-index:5;
  left:0;
  top:0;
  width:100%;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding:10px;
  pointer-events:none;
}
#brand, .hudCard, #soundBtn {
  background:rgba(19,25,30,.84);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 5px 18px rgba(0,0,0,.25);
  backdrop-filter:blur(5px);
}
#brand {
  min-width:220px;
  padding:8px 12px 9px;
  border-radius:13px;
}
#brand h1 {
  margin:0;
  font-size:21px;
  line-height:1;
  letter-spacing:.4px;
  color:#fff3b5;
}
#brand p {
  margin:5px 0 0;
  font-size:11px;
  color:#cdd7da;
  white-space:nowrap;
}
#hud {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:7px;
  max-width:66%;
}
.hudCard {
  min-height:48px;
  padding:7px 10px;
  border-radius:11px;
  text-align:center;
}
.label {
  display:block;
  color:#9eafb7;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1.1px;
  margin-bottom:4px;
}
.value {
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
}
#powerPips {
  display:flex;
  gap:3px;
  height:15px;
  align-items:flex-end;
}
.pip {
  width:8px;
  height:7px;
  border-radius:2px;
  background:#39444a;
  border:1px solid rgba(255,255,255,.1);
}
.pip:nth-child(2) { height:9px; }
.pip:nth-child(3) { height:11px; }
.pip:nth-child(4) { height:13px; }
.pip:nth-child(5) { height:15px; }
.pip.on {
  background:#ffd35a;
  box-shadow:0 0 7px rgba(255,211,90,.62);
}
#soundBtn {
  pointer-events:auto;
  color:#fff;
  border-radius:11px;
  width:42px;
  height:42px;
  padding:0;
  font-size:18px;
  cursor:pointer;
}
#soundBtn:active, #modalButton:active { transform:translateY(1px); }

#howto {
  position:absolute;
  z-index:5;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:max-content;
  max-width:calc(100% - 20px);
  padding:8px 13px;
  border-radius:12px;
  background:rgba(17,22,27,.84);
  border:1px solid rgba(255,255,255,.13);
  color:#dce6e8;
  font-size:11px;
  line-height:1.35;
  text-align:center;
  pointer-events:none;
  box-shadow:0 5px 18px rgba(0,0,0,.28);
}
#howto b { color:#ffe27c; }

#toast {
  position:absolute;
  z-index:7;
  left:50%;
  top:22%;
  transform:translate(-50%, -8px);
  padding:9px 14px;
  border-radius:20px;
  color:#fff8d6;
  background:rgba(27,34,38,.9);
  border:1px solid rgba(255,224,116,.35);
  font-size:13px;
  font-weight:bold;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s, transform .16s;
}
#toast.show {
  opacity:1;
  transform:translate(-50%, 0);
}

#modal {
  position:absolute;
  z-index:10;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(8,11,14,.32);
  opacity:1;
  transition:opacity .18s;
}
#modal.hidden {
  opacity:0;
  pointer-events:none;
}
#modalPanel {
  width:min(390px, 92vw);
  padding:23px;
  border-radius:20px;
  text-align:center;
  color:#f8f7ee;
  background:linear-gradient(160deg, rgba(38,48,54,.98), rgba(20,25,29,.98));
  border:1px solid rgba(255,255,255,.17);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#modalIcon {
  font-size:38px;
  line-height:1;
  color:#ffd65d;
  min-height:40px;
}
#modalTitle {
  margin:10px 0 6px;
  font-size:25px;
  color:#fff2b2;
}
#modalText {
  margin:0 auto 17px;
  max-width:320px;
  color:#cdd7d9;
  font-size:13px;
  line-height:1.5;
}
#modalButton {
  appearance:none;
  border:0;
  border-radius:12px;
  padding:11px 22px;
  min-width:145px;
  color:#263238;
  background:#ffdb63;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 #c79d29;
}
#courseTag {
  position:absolute;
  z-index:4;
  right:12px;
  bottom:52px;
  padding:6px 10px;
  border-radius:9px;
  background:rgba(20,26,31,.7);
  color:#cbd7da;
  border:1px solid rgba(255,255,255,.1);
  font-size:10px;
  letter-spacing:.5px;
  pointer-events:none;
}

@media (max-width:720px) {
  #topbar { padding:6px; gap:5px; }
  #brand { min-width:0; padding:7px 9px; }
  #brand h1 { font-size:16px; }
  #brand p { font-size:9px; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
  #hud { max-width:62%; gap:4px; }
  .hudCard { min-height:39px; padding:5px 7px; }
  .label { font-size:7px; margin-bottom:3px; }
  .value { font-size:12px; }
  #powerPips { height:12px; }
  .pip { width:6px; }
  #soundBtn { width:35px; height:35px; font-size:15px; }
  #howto { bottom:6px; font-size:9px; padding:6px 9px; }
  #courseTag { bottom:42px; right:7px; }
}
@media (max-width:480px) {
  #brand p { display:none; }
  #brand h1 { font-size:14px; }
  .optionalCard { display:none; }
  #hud { max-width:68%; }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas" aria-label="Desk Fan Drift game board"></canvas>

  <div id="topbar">
    <div id="brand">
      <h1>Desk Fan Drift</h1>
      <p>One fan. One sail cart. Questionable aerodynamics.</p>
    </div>
    <div id="hud">
      <div class="hudCard">
        <span class="label">COURSE</span>
        <span class="value" id="courseValue">1 / 5</span>
      </div>
      <div class="hudCard">
        <span class="label">GUSTS</span>
        <span class="value" id="gustValue">●●●●</span>
      </div>
      <div class="hudCard">
        <span class="label">POWER</span>
        <span id="powerPips">
          <i class="pip on"></i><i class="pip on"></i><i class="pip on"></i><i class="pip on"></i><i class="pip on"></i>
        </span>
      </div>
      <div class="hudCard optionalCard">
        <span class="label">FLOW</span>
        <span class="value" id="flowValue">READY</span>
      </div>
      <div class="hudCard">
        <span class="label">SCORE</span>
        <span class="value" id="scoreValue">0</span>
      </div>
      <button id="soundBtn" aria-label="Toggle sound" title="Toggle sound">♪</button>
    </div>
  </div>

  <div id="toast">Bell collected!</div>
  <div id="courseTag">Broad Run · Par 2</div>
  <div id="howto"><b>How to play:</b> drag from the fan to aim and set power, then release · Arrow keys adjust · Space blows</div>

  <div id="modal" class="hidden">
    <div id="modalPanel">
      <div id="modalIcon">⚑</div>
      <h2 id="modalTitle">Course Clear!</h2>
      <p id="modalText"></p>
      <button id="modalButton">Next Course</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var modal = document.getElementById("modal");
  var modalIcon = document.getElementById("modalIcon");
  var modalTitle = document.getElementById("modalTitle");
  var modalText = document.getElementById("modalText");
  var modalButton = document.getElementById("modalButton");
  var toastEl = document.getElementById("toast");
  var courseValue = document.getElementById("courseValue");
  var gustValue = document.getElementById("gustValue");
  var flowValue = document.getElementById("flowValue");
  var scoreValue = document.getElementById("scoreValue");
  var courseTag = document.getElementById("courseTag");
  var soundBtn = document.getElementById("soundBtn");
  var pips = document.querySelectorAll(".pip");

  var WORLD_W = 1000;
  var WORLD_H = 650;
  var scale = 1;
  var offsetX = 0;
  var offsetY = 0;
  var dpr = 1;

  var fan = { x:110, y:545 };
  var angle = -0.38;
  var power = 5;
  var status = "ready";
  var shotElapsed = 0;
  var SHOT_TIME = 5;
  var levelIndex = 0;
  var gusts = 0;
  var totalScore = 0;
  var roundBonus = 0;
  var totalPennants = 0;
  var bellsTaken = [];
  var edgeFlash = 0;
  var goalGlow = 0;
  var goalRattle = 0;
  var minGoalDistance = 9999;
  var wobble = 0;
  var lastCollisionSound = 0;
  var resetTimer = 0;
  var toastTimer = 0;
  var lastTime = performance.now();
  var idleRibbonClock = 0;
  var activeRibbonClock = 0;
  var dragging = false;
  var dragMoved = false;
  var pointerId = -1;
  var dragStartX = 0;
  var dragStartY = 0;
  var keys = {};
  var muted = false;
  var audioContext = null;
  var ribbons = [];
  var trails = [];
  var gameTime = 0;

  var cart = {
    x:220, y:500, vx:0, vy:0, radius:16,
    heading:-0.35, finish:false
  };

  var courses = [
    {
      name:"Broad Run",
      par:2,
      maxGusts:4,
      guide:2.5,
      start:{x:220,y:500},
      goal:{x:800,y:270,w:82,h:62},
      boxes:[
        {x:520,y:470,w:190,h:40,a:-0.08,color:"#d55b48",label:"ERASER"}
      ],
      bumpers:[
        {x:515,y:385,r:41,color:"#e5b54e"}
      ],
      currents:[],
      bells:[
        {x:535,y:285}
      ]
    },
    {
      name:"Book Bend",
      par:3,
      maxGusts:5,
      guide:2.1,
      start:{x:205,y:505},
      goal:{x:815,y:145,w:78,h:58},
      boxes:[
        {x:475,y:345,w:285,h:76,a:-0.17,color:"#477f82",label:"AIRFLOW FOR BEGINNERS"},
        {x:725,y:465,w:175,h:38,a:0.08,color:"#d86650",label:"PENCIL CASE"}
      ],
      bumpers:[
        {x:300,y:265,r:35,color:"#dfb950"}
      ],
      currents:[],
      bells:[
        {x:670,y:265}
      ]
    },
    {
      name:"Narrow Notes",
      par:3,
      maxGusts:5,
      guide:1.7,
      start:{x:190,y:510},
      goal:{x:835,y:190,w:72,h:54},
      boxes:[
        {x:410,y:340,w:330,h:42,a:0,color:"#5b7da5",label:"NOTEBOOK"},
        {x:835,y:340,w:250,h:42,a:0,color:"#5b7da5",label:"NOTEBOOK"},
        {x:655,y:480,w:46,h:150,a:0.04,color:"#ca604c",label:""}
      ],
      bumpers:[
        {x:620,y:252,r:30,color:"#e1b14a"}
      ],
      currents:[],
      bells:[
        {x:665,y:310},
        {x:770,y:245}
      ]
    },
    {
      name:"Cross Draft",
      par:3,
      maxGusts:5,
      guide:1.35,
      start:{x:205,y:500},
      goal:{x:835,y:160,w:72,h:54},
      boxes:[
        {x:340,y:275,w:185,h:38,a:-0.22,color:"#c45c4a",label:"RULER"},
        {x:705,y:405,w:215,h:42,a:0.17,color:"#4e7b81",label:"VENT MANUAL"}
      ],
      bumpers:[
        {x:575,y:175,r:35,color:"#e1b44e"},
        {x:525,y:500,r:31,color:"#e1b44e"}
      ],
      currents:[
        {x:420,y:150,w:245,h:365,ax:12,ay:34,label:"FIXED VENT"}
      ],
      bells:[
        {x:520,y:245}
      ]
    },
    {
      name:"The Bank Job",
      par:3,
      maxGusts:4,
      guide:1.0,
      start:{x:205,y:510},
      goal:{x:858,y:128,w:70,h:52},
      boxes:[
        {x:485,y:385,w:350,h:42,a:-0.55,color:"#4c7881",label:"ANGLE GUIDE"},
        {x:735,y:245,w:270,h:40,a:0.34,color:"#c75f4c",label:"LEDGER"},
        {x:340,y:170,w:190,h:36,a:0.18,color:"#637ea1",label:"NOTES"}
      ],
      bumpers:[
        {x:730,y:485,r:32,color:"#dfb34a"}
      ],
      currents:[
        {x:565,y:90,w:165,h:180,ax:-19,ay:13,label:"SIDE VENT"}
      ],
      bells:[
        {x:610,y:310},
        {x:780,y:155}
      ]
    }
  ];

  function currentCourse() {
    return courses[levelIndex];
  }

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function resize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    scale = Math.min(w / WORLD_W, h / WORLD_H);
    offsetX = (w - WORLD_W * scale) * 0.5;
    offsetY = (h - WORLD_H * scale) * 0.5;
  }

  window.addEventListener("resize", resize);
  resize();

  function toWorld(clientX, clientY) {
    return {
      x:(clientX - offsetX) / scale,
      y:(clientY - offsetY) / scale
    };
  }

  function roundedRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function initAudio() {
    if (audioContext) {
      if (audioContext.state === "suspended") audioContext.resume();
      return;
    }
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioContext = null;
    }
  }

  function tone(freq, duration, type, volume, delay) {
    if (muted || !audioContext) return;
    var start = audioContext.currentTime + (delay || 0);
    var osc = audioContext.createOscillator();
    var gain = audioContext.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(Math.max(0.0001, volume || 0.04), start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  function playWhoosh() {
    tone(92, 0.28, "sawtooth", 0.025, 0);
    tone(145, 0.18, "triangle", 0.018, 0.05);
  }

  function playClack() {
    var now = performance.now();
    if (now - lastCollisionSound < 90) return;
    lastCollisionSound = now;
    tone(125, 0.08, "square", 0.04, 0);
    tone(82, 0.1, "triangle", 0.025, 0.02);
  }

  function playBell() {
    tone(880, 0.55, "sine", 0.07, 0);
    tone(1320, 0.48, "sine", 0.04, 0.05);
  }

  function playFall() {
    tone(185, 0.35, "sawtooth", 0.045, 0);
    tone(92, 0.52, "triangle", 0.04, 0.08);
  }

  soundBtn.addEventListener("click", function () {
    initAudio();
    muted = !muted;
    soundBtn.textContent = muted ? "×" : "♪";
    soundBtn.setAttribute("aria-label", muted ? "Enable sound" : "Mute sound");
  });

  function showToast(text, seconds) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    toastTimer = seconds || 1.5;
  }

  function hideToast() {
    toastEl.classList.remove("show");
  }

  function setModal(icon, title, text, buttonText) {
    modalIcon.textContent = icon;
    modalTitle.textContent = title;
    modalText.textContent = text;
    modalButton.textContent = buttonText;
    modal.classList.remove("hidden");
  }

  function hideModal() {
    modal.classList.add("hidden");
  }

  function resetRound() {
    if (resetTimer) {
      clearTimeout(resetTimer);
      resetTimer = 0;
    }
    var c = currentCourse();
    cart.x = c.start.x;
    cart.y = c.start.y;
    cart.vx = 0;
    cart.vy = 0;
    cart.heading = Math.atan2(c.goal.y - c.start.y, c.goal.x - c.start.x);
    cart.finish = false;
    angle = cart.heading;
    power = 5;
    gusts = c.maxGusts;
    roundBonus = 0;
    bellsTaken = [];
    for (var i = 0; i < c.bells.length; i++) bellsTaken.push(false);
    status = "ready";
    shotElapsed = 0;
    minGoalDistance = 9999;
    goalGlow = 0;
    goalRattle = 0;
    edgeFlash = 0;
    wobble = 0;
    ribbons.length = 0;
    trails.length = 0;
    hideModal();
    updateHUD();
  }

  function loadLevel(index) {
    levelIndex = clamp(index, 0, courses.length - 1);
    resetRound();
  }

  function updateHUD() {
    var c = currentCourse();
    courseValue.textContent = (levelIndex + 1) + " / " + courses.length;
    var dots = "";
    for (var i = 0; i < c.maxGusts; i++) dots += i < gusts ? "●" : "○";
    gustValue.textContent = dots;
    var lit = Math.ceil(power - 0.001);
    for (var j = 0; j < pips.length; j++) {
      if (j < lit) pips[j].classList.add("on");
      else pips[j].classList.remove("on");
    }
    if (status === "blowing") {
      flowValue.textContent = Math.max(0, SHOT_TIME - shotElapsed).toFixed(1) + "s";
    } else if (status === "ready") {
      flowValue.textContent = "READY";
    } else if (status === "won") {
      flowValue.textContent = "PARKED";
    } else {
      flowValue.textContent = "RESET";
    }
    scoreValue.textContent = String(totalScore + roundBonus);
    courseTag.textContent = c.name + " · Par " + c.par;
  }

  function startGust() {
    if (status !== "ready" || gusts <= 0) return;
    initAudio();
    status = "blowing";
    shotElapsed = 0;
    gusts -= 1;
    minGoalDistance = 9999;
    trails.push({x:cart.x, y:cart.y, life:4.5, br:true});
    playWhoosh();
    spawnRibbonBurst();
    updateHUD();
  }

  function spawnRibbon(faint) {
    var spread = faint ? 0.12 : 0.22;
    var a = angle + (Math.random() - 0.5) * spread;
    var speed = faint ? 90 + Math.random() * 30 : 145 + power * 28 + Math.random() * 45;
    ribbons.push({
      x:fan.x + Math.cos(a) * 38,
      y:fan.y + Math.sin(a) * 38,
      vx:Math.cos(a) * speed,
      vy:Math.sin(a) * speed,
      life:faint ? 1.9 : 3.0,
      total:faint ? 1.9 : 3.0,
      wave:Math.random() * 6.28,
      faint:faint
    });
    if (ribbons.length > 170) ribbons.shift();
  }

  function spawnRibbonBurst() {
    for (var i = 0; i < 15; i++) spawnRibbon(false);
  }

  function pointInsideCurrent(cur, x, y) {
    return x >= cur.x - cur.w * 0.5 &&
           x <= cur.x + cur.w * 0.5 &&
           y >= cur.y - cur.h * 0.5 &&
           y <= cur.y + cur.h * 0.5;
  }

  function getCurrentAcceleration(x, y) {
    var c = currentCourse();
    var ax = 0;
    var ay = 0;
    for (var i = 0; i < c.currents.length; i++) {
      if (pointInsideCurrent(c.currents[i], x, y)) {
        ax += c.currents[i].ax;
        ay += c.currents[i].ay;
      }
    }
    return {x:ax, y:ay};
  }

  function collideBox(box) {
    var ca = Math.cos(-box.a);
    var sa = Math.sin(-box.a);
    var dx = cart.x - box.x;
    var dy = cart.y - box.y;
    var lx = dx * ca - dy * sa;
    var ly = dx * sa + dy * ca;
    var hw = box.w * 0.5;
    var hh = box.h * 0.5;
    var qx = Math.abs(lx) - hw;
    var qy = Math.abs(ly) - hh;
    var nx = 0;
    var ny = 0;
    var penetration = 0;

    if (qx > 0 || qy > 0) {
      var cx = clamp(lx, -hw, hw);
      var cy = clamp(ly, -hh, hh);
      var ox = lx - cx;
      var oy = ly - cy;
      var d = Math.sqrt(ox * ox + oy * oy);
      if (d >= cart.radius || d === 0) return;
      nx = ox / d;
      ny = oy / d;
      penetration = cart.radius - d;
    } else {
      var faceX = hw - Math.abs(lx);
      var faceY = hh - Math.abs(ly);
      if (faceX < faceY) {
        nx = lx >= 0 ? 1 : -1;
        ny = 0;
        penetration = cart.radius + faceX;
      } else {
        nx = 0;
        ny = ly >= 0 ? 1 : -1;
        penetration = cart.radius + faceY;
      }
    }

    var cb = Math.cos(box.a);
    var sb = Math.sin(box.a);
    var wx = nx * cb - ny * sb;
    var wy = nx * sb + ny * cb;
    cart.x += wx * penetration;
    cart.y += wy * penetration;
    var vn = cart.vx * wx + cart.vy * wy;
    if (vn < 0) {
      cart.vx -= 1.65 * vn * wx;
      cart.vy -= 1.65 * vn * wy;
      cart.vx *= 0.93;
      cart.vy *= 0.93;
      wobble = Math.min(1.2, wobble + 0.8);
      playClack();
    }
  }

  function collideBumper(b) {
    var dx = cart.x - b.x;
    var dy = cart.y - b.y;
    var minD = cart.radius + b.r;
    var d2 = dx * dx + dy * dy;
    if (d2 >= minD * minD) return;
    var d = Math.sqrt(d2);
    var nx;
    var ny;
    if (d < 0.001) {
      nx = 1;
      ny = 0;
      d = 0;
    } else {
      nx = dx / d;
      ny = dy / d;
    }
    cart.x = b.x + nx * minD;
    cart.y = b.y + ny * minD;
    var vn = cart.vx * nx + cart.vy * ny;
    if (vn < 0) {
      cart.vx -= 1.78 * vn * nx;
      cart.vy -= 1.78 * vn * ny;
      cart.vx *= 0.95;
      cart.vy *= 0.95;
      wobble = Math.min(1.2, wobble + 0.95);
      playClack();
    }
  }

  function checkBells() {
    var c = currentCourse();
    for (var i = 0; i < c.bells.length; i++) {
      if (bellsTaken[i]) continue;
      var dx = cart.x - c.bells[i].x;
      var dy = cart.y - c.bells[i].y;
      if (dx * dx + dy * dy < 29 * 29) {
        bellsTaken[i] = true;
        roundBonus += 250;
        playBell();
        showToast("Desk bell! +250", 1.35);
      }
    }
  }

  function checkGoal() {
    var g = currentCourse().goal;
    var dx = cart.x - g.x;
    var dy = cart.y - g.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    minGoalDistance = Math.min(minGoalDistance, d);

    if (d < 100 && Math.abs(dx) > g.w * 0.5) {
      goalRattle = Math.max(goalRattle, 0.16);
    }

    if (Math.abs(dx) <= g.w * 0.5 && Math.abs(dy) <= g.h * 0.5) {
      winRound();
      return true;
    }
    return false;
  }

  function winRound() {
    if (status === "won") return;
    status = "won";
    cart.finish = true;
    cart.vx = 0;
    cart.vy = 0;
    goalGlow = 1;
    goalRattle = 0;
    playBell();

    var c = currentCourse();
    var used = c.maxGusts - gusts;
    var pennants = used <= c.par ? 3 : (used === c.par + 1 ? 2 : 1);
    var courseScore = 800 + gusts * 180 + roundBonus + pennants * 120;
    totalScore += courseScore;
    totalPennants += pennants;
    roundBonus = 0;

    var flags = "";
    for (var i = 0; i < pennants; i++) flags += "⚑";
    var bellCount = 0;
    for (var j = 0; j < bellsTaken.length; j++) if (bellsTaken[j]) bellCount++;

    var extra = bellCount ? " You rang " + bellCount + " optional bell" + (bellCount === 1 ? "." : "s.") : "";
    if (levelIndex === courses.length - 1) {
      setModal(flags, "Desktop Champion!", "All courses cleared with " + totalPennants + " pennants and " + totalScore + " points." + extra, "Restart Tour");
    } else {
      setModal(flags, "Course Clear!", used + " gust" + (used === 1 ? "" : "s") + " used · Par " + c.par + " · +" + courseScore + " points." + extra, "Next Course");
    }
    updateHUD();
  }

  function loseRound(reason, fell) {
    if (status === "lost" || status === "won") return;
    status = "lost";
    cart.vx = 0;
    cart.vy = 0;
    if (fell) {
      edgeFlash = 1;
      playFall();
    } else {
      tone(145, 0.25, "triangle", 0.04, 0);
    }
    setModal(fell ? "↯" : "○", fell ? "Off the Desk!" : "Out of Gusts", reason + " The cart is reset and ready for an instant retry.", "Retry Course");
    updateHUD();

    resetTimer = setTimeout(function () {
      if (status === "lost") {
        var c = currentCourse();
        cart.x = c.start.x;
        cart.y = c.start.y;
        cart.vx = 0;
        cart.vy = 0;
        cart.heading = Math.atan2(c.goal.y - c.start.y, c.goal.x - c.start.x);
      }
    }, 360);
  }

  modalButton.addEventListener("click", function () {
    initAudio();
    if (status === "won") {
      if (levelIndex === courses.length - 1) {
        totalScore = 0;
        totalPennants = 0;
        loadLevel(0);
      } else {
        loadLevel(levelIndex + 1);
      }
    } else {
      resetRound();
    }
  });

  function pointBlocked(x, y) {
    var c = currentCourse();
    for (var i = 0; i < c.boxes.length; i++) {
      var b = c.boxes[i];
      var ca = Math.cos(-b.a);
      var sa = Math.sin(-b.a);
      var dx = x - b.x;
      var dy = y - b.y;
      var lx = dx * ca - dy * sa;
      var ly = dx * sa + dy * ca;
      if (Math.abs(lx) < b.w * 0.5 + cart.radius &&
          Math.abs(ly) < b.h * 0.5 + cart.radius) return true;
    }
    for (var j = 0; j < c.bumpers.length; j++) {
      var p = c.bumpers[j];
      var bx = x - p.x;
      var by = y - p.y;
      var rr = p.r + cart.radius;
      if (bx * bx + by * by < rr * rr) return true;
    }
    return false;
  }

  function physicsStep(dt) {
    if (status !== "blowing") return;

    var accel = 22 + power * 14;
    var cur = getCurrentAcceleration(cart.x, cart.y);
    cart.vx += (Math.cos(angle) * accel + cur.x) * dt;
    cart.vy += (Math.sin(angle) * accel + cur.y) * dt;

    var drag = Math.exp(-1.18 * dt);
    cart.vx *= drag;
    cart.vy *= drag;
    cart.x += cart.vx * dt;
    cart.y += cart.vy * dt;

    var c = currentCourse();
    for (var i = 0; i < c.boxes.length; i++) collideBox(c.boxes[i]);
    for (var j = 0; j < c.bumpers.length; j++) collideBumper(c.bumpers[j]);

    var speed = Math.sqrt(cart.vx * cart.vx + cart.vy * cart.vy);
    if (speed > 3) cart.heading = Math.atan2(cart.vy, cart.vx);

    checkBells();
    if (checkGoal()) return;

    if (cart.x < 20 || cart.x > WORLD_W - 20 || cart.y < 20 || cart.y > WORLD_H - 20) {
      loseRound("That gust needed a little less ambition.", true);
      return;
    }
  }

  function finishShot() {
    if (status !== "blowing") return;
    cart.vx = 0;
    cart.vy = 0;

    if (minGoalDistance < 105) {
      goalRattle = 1.25;
      showToast("So close — the goal marker rattles!", 1.7);
    }

    if (gusts <= 0) {
      loseRound("The final airflow ribbon faded short of the striped pad.", false);
    } else {
      status = "ready";
      updateHUD();
    }
  }

  function updateRibbons(dt) {
    idleRibbonClock += dt;
    activeRibbonClock += dt;

    if (status === "ready" && idleRibbonClock > 0.23) {
      idleRibbonClock = 0;
      spawnRibbon(true);
    }
    if (status === "blowing" && activeRibbonClock > 0.055) {
      activeRibbonClock = 0;
      spawnRibbon(false);
      if (Math.random() < 0.42) spawnRibbon(false);
    }

    for (var i = ribbons.length - 1; i >= 0; i--) {
      var r = ribbons[i];
      r.life -= dt;
      r.wave += dt * 7;
      r.x += r.vx * dt + Math.sin(r.wave) * 5 * dt;
      r.y += r.vy * dt + Math.cos(r.wave * 0.8) * 4 * dt;
      if (r.life <= 0 || r.x < -50 || r.x > WORLD_W + 50 || r.y < -50 || r.y > WORLD_H + 50) {
        ribbons.splice(i, 1);
      }
    }
  }

  function updateTrails(dt) {
    for (var i = trails.length - 1; i >= 0; i--) {
      trails[i].life -= dt;
      if (trails[i].life <= 0) trails.splice(i, 1);
    }
  }

  function update(dt) {
    gameTime += dt;

    if (status === "ready" && !dragging) {
      if (keys.ArrowLeft) angle -= 1.25 * dt;
      if (keys.ArrowRight) angle += 1.25 * dt;
      if (keys.ArrowUp) power += 2.2 * dt;
      if (keys.ArrowDown) power -= 2.2 * dt;
      angle = normalizeAngle(angle);
      power = clamp(power, 1, 5);
    }

    if (status === "blowing") {
      var substeps = Math.max(1, Math.ceil(dt / 0.012));
      var step = dt / substeps;
      for (var i = 0; i < substeps; i++) {
        physicsStep(step);
        if (status !== "blowing") break;
      }
      if (status === "blowing") {
        shotElapsed += dt;
        if (Math.floor(shotElapsed * 20) !== Math.floor((shotElapsed - dt) * 20)) {
          trails.push({x:cart.x, y:cart.y, life:4.5, br:false});
          if (trails.length > 190) trails.shift();
        }
        if (shotElapsed >= SHOT_TIME) finishShot();
      }
    }

    updateRibbons(dt);
    updateTrails(dt);
    wobble = Math.max(0, wobble - dt * 2.4);
    edgeFlash = Math.max(0, edgeFlash - dt * 1.8);
    goalGlow = Math.max(0, goalGlow - dt * 0.3);
    goalRattle = Math.max(0, goalRattle - dt);

    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) hideToast();
    }

    updateHUD();
  }

  function drawTable() {
    var grad = ctx.createLinearGradient(0, 0, 0, WORLD_H);
    grad.addColorStop(0, "#a96f45");
    grad.addColorStop(0.55, "#95603b");
    grad.addColorStop(1, "#805033");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = "#4c2b1b";
    ctx.lineWidth = 2;
    for (var i = 0; i < 15; i++) {
      var y = 35 + i * 42 + Math.sin(i * 1.7) * 6;
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (var x = 0; x <= WORLD_W; x += 80) {
        ctx.lineTo(x, y + Math.sin(x * 0.018 + i) * 5);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(23,14,10,.38)";
    ctx.fillRect(0, 0, WORLD_W, 22);
    ctx.fillRect(0, WORLD_H - 22, WORLD_W, 22);
    ctx.fillRect(0, 0, 22, WORLD_H);
    ctx.fillRect(WORLD_W - 22, 0, 22, WORLD_H);

    ctx.strokeStyle = "rgba(255,230,188,.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(25, 25, WORLD_W - 50, WORLD_H - 50);

    ctx.save();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = "#fff";
    for (var j = 0; j < 80; j++) {
      var px = (j * 137) % WORLD_W;
      var py = (j * 83) % WORLD_H;
      ctx.fillRect(px, py, 2, 2);
    }
    ctx.restore();
  }

  function drawCurrents() {
    var currents = currentCourse().currents;
    for (var i = 0; i < currents.length; i++) {
      var cur = currents[i];
      var x = cur.x - cur.w * 0.5;
      var y = cur.y - cur.h * 0.5;
      ctx.save();
      ctx.fillStyle = "rgba(89,196,222,.10)";
      ctx.strokeStyle = "rgba(135,231,247,.42)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      roundedRectPath(ctx, x, y, cur.w, cur.h, 18);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);

      var a = Math.atan2(cur.ay, cur.ax);
      for (var row = 0; row < 4; row++) {
        for (var col = 0; col < 3; col++) {
          var sx = x + 35 + col * (cur.w - 70) / 2;
          var sy = y + 40 + row * (cur.h - 80) / 3;
          var flutter = Math.sin(gameTime * 4 + row * 1.7 + col) * 6;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(a);
          ctx.strokeStyle = "rgba(174,240,250,.62)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-14, 0);
          ctx.quadraticCurveTo(0, flutter, 15, 0);
          ctx.stroke();
          ctx.fillStyle = "rgba(174,240,250,.7)";
          ctx.beginPath();
          ctx.moveTo(19, 0);
          ctx.lineTo(10, -5);
          ctx.lineTo(11, 5);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.fillStyle = "rgba(208,248,255,.75)";
      ctx.font = "bold 10px Arial";
      ctx.textAlign = "center";
      ctx.fillText(cur.label, cur.x, y + 16);
      ctx.restore();
    }
  }

  function drawPrediction() {
    var alpha = status === "ready" ? 0.83 : 0.28;
    ctx.save();
    ctx.globalAlpha = alpha;

    var coneLength = 120 + power * 27;
    var spread = 0.13;
    ctx.strokeStyle = "#ffe58a";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 7]);
    ctx.beginPath();
    ctx.moveTo(fan.x + Math.cos(angle - spread) * 45, fan.y + Math.sin(angle - spread) * 45);
    ctx.lineTo(fan.x + Math.cos(angle - spread) * coneLength, fan.y + Math.sin(angle - spread) * coneLength);
    ctx.moveTo(fan.x + Math.cos(angle + spread) * 45, fan.y + Math.sin(angle + spread) * 45);
    ctx.lineTo(fan.x + Math.cos(angle + spread) * coneLength, fan.y + Math.sin(angle + spread) * coneLength);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "rgba(255,229,138,.13)";
    ctx.beginPath();
    ctx.moveTo(fan.x + Math.cos(angle) * 35, fan.y + Math.sin(angle) * 35);
    ctx.arc(fan.x, fan.y, coneLength, angle - spread, angle + spread);
    ctx.closePath();
    ctx.fill();

    var px = cart.x;
    var py = cart.y;
    var vx = 0;
    var vy = 0;
    var simTime = currentCourse().guide;
    var dt = 0.12;
    var accel = 22 + power * 14;

    ctx.fillStyle = "#fff3a9";
    for (var t = 0; t <= simTime; t += dt) {
      var cur = getCurrentAcceleration(px, py);
      vx += (Math.cos(angle) * accel + cur.x) * dt;
      vy += (Math.sin(angle) * accel + cur.y) * dt;
      var drag = Math.exp(-1.18 * dt);
      vx *= drag;
      vy *= drag;
      px += vx * dt;
      py += vy * dt;
      if (pointBlocked(px, py)) break;
      if (Math.floor(t / dt) % 2 === 0) {
        ctx.beginPath();
        ctx.arc(px, py, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawTrail() {
    if (trails.length < 2) return;
    ctx.save();
    ctx.lineCap = "round";
    for (var i = 1; i < trails.length; i++) {
      var a = trails[i - 1];
      var b = trails[i];
      if (b.br) continue;
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      if (dx * dx + dy * dy > 2500) continue;
      var life = Math.min(a.life, b.life);
      ctx.strokeStyle = "rgba(207,244,250," + (0.1 + life / 4.5 * 0.42) + ")";
      ctx.lineWidth = 2 + life * 0.45;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGoal() {
    var g = currentCourse().goal;
    var shake = goalRattle > 0 ? Math.sin(gameTime * 39) * 4 * Math.min(1, goalRattle * 2) : 0;
    ctx.save();
    ctx.translate(shake, 0);

    if (goalGlow > 0 || status === "won") {
      var glow = ctx.createRadialGradient(g.x, g.y, 10, g.x, g.y, 75);
      glow.addColorStop(0, "rgba(255,239,120,.65)");
      glow.addColorStop(1, "rgba(255,239,120,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(g.x, g.y, 78, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    roundedRectPath(ctx, g.x - g.w * 0.5, g.y - g.h * 0.5, g.w, g.h, 10);
    ctx.clip();
    ctx.fillStyle = "#f2eee0";
    ctx.fillRect(g.x - g.w * 0.5, g.y - g.h * 0.5, g.w, g.h);
    ctx.strokeStyle = status === "won" ? "#ffd94f" : "#d65343";
    ctx.lineWidth = 13;
    for (var i = -g.h; i < g.w + g.h; i += 24) {
      ctx.beginPath();
      ctx.moveTo(g.x - g.w * 0.5 + i, g.y + g.h * 0.5);
      ctx.lineTo(g.x - g.w * 0.5 + i + g.h, g.y - g.h * 0.5);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = status === "won" ? "#fff08a" : "#f8f2da";
    ctx.lineWidth = 3;
    roundedRectPath(ctx, g.x - g.w * 0.5, g.y - g.h * 0.5, g.w, g.h, 10);
    ctx.stroke();

    var poleX = g.x + g.w * 0.5 + 10;
    ctx.strokeStyle = "#3e4547";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(poleX, g.y + 22);
    ctx.lineTo(poleX, g.y - 42);
    ctx.stroke();
    ctx.fillStyle = status === "won" ? "#ffdb4f" : "#f5f0dc";
    ctx.beginPath();
    ctx.moveTo(poleX, g.y - 42);
    ctx.lineTo(poleX + 29, g.y - 34 + Math.sin(gameTime * 8) * 2);
    ctx.lineTo(poleX, g.y - 24);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#65452f";
    ctx.font = "bold 10px Arial";
    ctx.textAlign = "center";
    ctx.fillText("PARK", g.x, g.y + 4);
    ctx.restore();
  }

  function drawBox(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.a);

    ctx.fillStyle = "rgba(35,20,14,.28)";
    roundedRectPath(ctx, -b.w * 0.5 + 5, -b.h * 0.5 + 7, b.w, b.h, 8);
    ctx.fill();

    ctx.fillStyle = b.color;
    roundedRectPath(ctx, -b.w * 0.5, -b.h * 0.5, b.w, b.h, 8);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.34)";
    ctx.lineWidth = 2;
    roundedRectPath(ctx, -b.w * 0.5 + 2, -b.h * 0.5 + 2, b.w - 4, b.h - 4, 7);
    ctx.stroke();

    if (b.label) {
      ctx.fillStyle = "rgba(255,255,255,.72)";
      ctx.font = "bold " + Math.min(12, Math.max(8, b.h * 0.2)) + "px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(b.label, 0, 1, b.w - 18);
    }
    ctx.restore();
  }

  function drawBumper(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = "rgba(38,21,12,.27)";
    ctx.beginPath();
    ctx.arc(5, 7, b.r, 0, Math.PI * 2);
    ctx.fill();

    var grad = ctx.createRadialGradient(-b.r * 0.25, -b.r * 0.3, 4, 0, 0, b.r);
    grad.addColorStop(0, "#fff0a0");
    grad.addColorStop(0.38, b.color);
    grad.addColorStop(1, "#a66e25");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.48)";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = "rgba(115,75,27,.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, b.r * 0.65, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawBell(b, index) {
    if (bellsTaken[index]) return;
    var pulse = 1 + Math.sin(gameTime * 4 + index) * 0.05;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(pulse, pulse);

    ctx.fillStyle = "rgba(255,223,96,.13)";
    ctx.beginPath();
    ctx.arc(0, 0, 28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#5f4024";
    ctx.beginPath();
    ctx.ellipse(2, 8, 17, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    var grad = ctx.createRadialGradient(-6, -8, 2, 0, 0, 19);
    grad.addColorStop(0, "#fff2a2");
    grad.addColorStop(0.35, "#e6b94e");
    grad.addColorStop(1, "#976729");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 17, Math.PI, 0);
    ctx.lineTo(17, 7);
    ctx.lineTo(-17, 7);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#f8dd7a";
    ctx.beginPath();
    ctx.arc(0, -17, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawRibbons() {
    ctx.save();
    ctx.lineCap = "round";
    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      var fade = clamp(r.life / r.total, 0, 1);
      var speed = Math.sqrt(r.vx * r.vx + r.vy * r.vy);
      var nx = r.vx / speed;
      var ny = r.vy / speed;
      var len = r.faint ? 22 : 35;
      ctx.strokeStyle = r.faint ?
        "rgba(218,246,250," + (fade * 0.22) + ")" :
        "rgba(224,250,255," + (fade * 0.48) + ")";
      ctx.lineWidth = r.faint ? 1.5 : 2.5;
      ctx.beginPath();
      ctx.moveTo(r.x - nx * len, r.y - ny * len);
      ctx.quadraticCurveTo(
        r.x - nx * len * 0.45 + Math.sin(r.wave) * 6,
        r.y - ny * len * 0.45 + Math.cos(r.wave) * 6,
        r.x, r.y
      );
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCart() {
    ctx.save();
    ctx.translate(cart.x, cart.y);
    var shake = wobble > 0 ? Math.sin(gameTime * 42) * wobble * 0.18 : 0;
    ctx.rotate(cart.heading + shake);

    ctx.fillStyle = "rgba(28,18,12,.28)";
    roundedRectPath(ctx, -21, -12 + 5, 43, 25, 6);
    ctx.fill();

    ctx.fillStyle = "#27353b";
    roundedRectPath(ctx, -21, -12, 42, 24, 5);
    ctx.fill();
    ctx.strokeStyle = "#9eafb3";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#141a1d";
    ctx.fillRect(-15, -17, 10, 5);
    ctx.fillRect(7, -17, 10, 5);
    ctx.fillRect(-15, 12, 10, 5);
    ctx.fillRect(7, 12, 10, 5);

    ctx.strokeStyle = "#d8dbd4";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-4, 0);
    ctx.lineTo(-4, -38);
    ctx.stroke();

    var flutter = status === "blowing" ? Math.sin(gameTime * 16) * 3 : Math.sin(gameTime * 4) * 1.2;
    ctx.fillStyle = "#f2eee0";
    ctx.beginPath();
    ctx.moveTo(-3, -36);
    ctx.quadraticCurveTo(12 + flutter, -20, 14, 2);
    ctx.lineTo(-3, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#c5bfae";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = "#ef654f";
    ctx.beginPath();
    ctx.moveTo(-3, -35);
    ctx.lineTo(7 + flutter, -31);
    ctx.lineTo(-3, -25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (cart.finish) {
      ctx.save();
      ctx.translate(cart.x, cart.y);
      ctx.strokeStyle = "#283034";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(12, -50);
      ctx.stroke();
      ctx.fillStyle = "#ffdc52";
      ctx.beginPath();
      ctx.moveTo(12, -49);
      ctx.lineTo(42, -41);
      ctx.lineTo(12, -31);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFan() {
    ctx.save();
    ctx.translate(fan.x, fan.y);

    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle = "rgba(21,28,32,.55)";
    roundedRectPath(ctx, 16, -16, 52, 32, 12);
    ctx.fill();
    ctx.strokeStyle = "#9eb1b7";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(65, 0);
    ctx.stroke();
    ctx.fillStyle = "#ffe27a";
    ctx.beginPath();
    ctx.moveTo(73, 0);
    ctx.lineTo(58, -9);
    ctx.lineTo(58, 9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "rgba(25,16,12,.28)";
    ctx.beginPath();
    ctx.ellipse(3, 38, 51, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#46565c";
    roundedRectPath(ctx, -42, 29, 84, 21, 10);
    ctx.fill();
    ctx.strokeStyle = "#96a8ad";
    ctx.lineWidth = 2;
    ctx.stroke();

    var spinning = status === "blowing" ? gameTime * (7 + power * 2) : gameTime * 0.5;
    ctx.save();
    ctx.rotate(spinning);
    ctx.fillStyle = status === "blowing" ? "#d8f0f2" : "#81949a";
    for (var i = 0; i < 4; i++) {
      ctx.rotate(Math.PI * 0.5);
      ctx.beginPath();
      ctx.moveTo(3, 0);
      ctx.quadraticCurveTo(18, -11, 31, -5);
      ctx.quadraticCurveTo(21, 8, 4, 7);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = "#28353a";
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#a9b9bd";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 43, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.55;
    for (var r = 13; r <= 36; r += 8) {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (var a = 0; a < Math.PI * 2; a += Math.PI / 6) {
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 7, Math.sin(a) * 7);
      ctx.lineTo(Math.cos(a) * 42, Math.sin(a) * 42);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (status === "ready") {
      ctx.strokeStyle = dragging ? "#fff1a2" : "rgba(255,241,162,.65)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, 57 + Math.sin(gameTime * 4) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#fff1ad";
      ctx.font = "bold 10px Arial";
      ctx.textAlign = "center";
      ctx.fillText(dragging ? "RELEASE TO BLOW" : "DRAG FROM FAN", 0, 70);
    }

    ctx.restore();
  }

  function drawPowerGauge() {
    ctx.save();
    ctx.translate(fan.x - 58, fan.y - 70);
    ctx.fillStyle = "rgba(20,26,29,.72)";
    roundedRectPath(ctx, 0, 0, 116, 23, 10);
    ctx.fill();
    for (var i = 0; i < 5; i++) {
      ctx.fillStyle = i < Math.ceil(power - 0.001) ? "#ffd65e" : "#475358";
      roundedRectPath(ctx, 9 + i * 20, 7, 14, 9, 3);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEdgeFlash() {
    if (edgeFlash <= 0) return;
    ctx.save();
    ctx.globalAlpha = edgeFlash * 0.8;
    var grad = ctx.createRadialGradient(WORLD_W * 0.5, WORLD_H * 0.5, 160, WORLD_W * 0.5, WORLD_H * 0.5, 570);
    grad.addColorStop(0, "rgba(255,45,35,0)");
    grad.addColorStop(1, "rgba(255,48,35,.95)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#12171d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
    drawTable();
    drawCurrents();
    drawPrediction();
    drawTrail();
    drawGoal();

    var c = currentCourse();
    for (var i = 0; i < c.boxes.length; i++) drawBox(c.boxes[i]);
    for (var j = 0; j < c.bumpers.length; j++) drawBumper(c.bumpers[j]);
    for (var k = 0; k < c.bells.length; k++) drawBell(c.bells[k], k);

    drawRibbons();
    drawCart();
    drawFan();
    drawPowerGauge();
    drawEdgeFlash();
  }

  canvas.addEventListener("pointerdown", function (e) {
    initAudio();
    if (status !== "ready") return;
    var p = toWorld(e.clientX, e.clientY);
    var dx = p.x - fan.x;
    var dy = p.y - fan.y;
    if (dx * dx + dy * dy <= 86 * 86) {
      dragging = true;
      dragMoved = false;
      pointerId = e.pointerId;
      dragStartX = p.x;
      dragStartY = p.y;
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragging || e.pointerId !== pointerId) return;
    var p = toWorld(e.clientX, e.clientY);
    var dx = p.x - fan.x;
    var dy = p.y - fan.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 5) angle = Math.atan2(dy, dx);
    power = clamp(dist / 52, 1, 5);
    if (Math.abs(p.x - dragStartX) + Math.abs(p.y - dragStartY) > 12) dragMoved = true;
    e.preventDefault();
  });

  function endPointer(e, cancelled) {
    if (!dragging || e.pointerId !== pointerId) return;
    dragging = false;
    pointerId = -1;
    if (!cancelled && dragMoved) startGust();
    e.preventDefault();
  }

  canvas.addEventListener("pointerup", function (e) {
    endPointer(e, false);
  });
  canvas.addEventListener("pointercancel", function (e) {
    endPointer(e, true);
  });

  window.addEventListener("keydown", function (e) {
    initAudio();
    keys[e.key] = true;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight" ||
        e.key === "ArrowUp" || e.key === "ArrowDown" ||
        e.code === "Space") {
      e.preventDefault();
    }

    if (e.code === "Space" && !e.repeat) {
      if (status === "ready") {
        startGust();
      } else if (status === "lost") {
        resetRound();
      } else if (status === "won") {
        if (levelIndex === courses.length - 1) {
          totalScore = 0;
          totalPennants = 0;
          loadLevel(0);
        } else {
          loadLevel(levelIndex + 1);
        }
      }
    }
  });

  window.addEventListener("keyup", function (e) {
    keys[e.key] = false;
  });

  function frame(now) {
    var dt = Math.min(0.04, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  loadLevel(0);
  requestAnimationFrame(frame);
}());
</script>
</body>
</html>
