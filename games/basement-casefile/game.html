<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Which X-Files Character Are You?</title>
<style>
  :root {
    --ink: #e4fff4;
    --paper: #071514;
    --panel: #102725;
    --panel2: #163b36;
    --line: #477d73;
    --acid: #d9ff57;
    --cyan: #54f3e5;
    --amber: #ffc653;
    --red: #ff5b66;
    --violet: #b996ff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
  }

  body {
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(circle at 18% 18%, rgba(84, 243, 229, .12), transparent 27rem),
      radial-gradient(circle at 82% 82%, rgba(185, 150, 255, .10), transparent 28rem),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
      #04100f;
    font-family: "Courier New", Courier, monospace;
  }

  button {
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }

  #app {
    width: 100%;
    height: 100%;
  }

  .quiz-shell {
    position: relative;
    width: min(940px, 100%);
    height: 100%;
    margin: 0 auto;
    padding: clamp(12px, 3vw, 30px);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .quiz-shell::before {
    content: "";
    position: absolute;
    inset: clamp(7px, 1.5vw, 16px);
    border: 1px solid rgba(123, 207, 190, .22);
    box-shadow: inset 0 0 64px rgba(71, 255, 210, .04);
    pointer-events: none;
  }

  .quiz-shell::after {
    content: "";
    position: absolute;
    top: 0;
    left: 13%;
    width: 33%;
    height: 4px;
    background: var(--acid);
    box-shadow: 0 0 16px var(--acid);
    pointer-events: none;
  }

  .quiz {
    position: relative;
    z-index: 1;
    width: min(760px, 100%);
    display: grid;
    gap: clamp(14px, 3vw, 28px);
  }

  .how-to {
    margin: 0;
    color: rgba(228, 255, 244, .72);
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: .04em;
    text-align: center;
  }

  .question-card {
    min-height: clamp(138px, 25vh, 205px);
    display: grid;
    align-content: center;
    padding: clamp(22px, 5vw, 48px);
    border: 1px solid #548d81;
    border-left: 5px solid var(--cyan);
    background:
      linear-gradient(90deg, transparent 0 96%, rgba(217,255,87,.08) 96% 100%),
      linear-gradient(145deg, rgba(26, 68, 61, .96), rgba(7, 22, 20, .98));
    box-shadow: 9px 9px 0 rgba(0, 0, 0, .25);
  }

  #question {
    margin: 0;
    color: #f2fff9;
    font-size: clamp(23px, 5.8vw, 44px);
    line-height: 1.05;
    letter-spacing: -.065em;
    text-wrap: balance;
  }

  .answer-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(10px, 2vw, 16px);
  }

  .answer {
    position: relative;
    min-height: clamp(104px, 19vh, 148px);
    padding: clamp(17px, 3vw, 26px) clamp(15px, 3vw, 25px) clamp(17px, 3vw, 26px) clamp(45px, 6vw, 58px);
    overflow: hidden;
    border: 1px solid #57857c;
    color: var(--ink);
    text-align: left;
    background: linear-gradient(135deg, rgba(27, 71, 64, .94), rgba(8, 27, 25, .96));
    box-shadow: 5px 5px 0 #020807;
    transition: transform .16s ease, border-color .16s ease, background .16s ease, filter .16s ease;
  }

  .answer::before {
    content: attr(data-key);
    position: absolute;
    top: clamp(14px, 2vw, 20px);
    left: clamp(13px, 2vw, 19px);
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border: 1px solid #80aaa1;
    color: var(--acid);
    font-size: 11px;
    font-weight: bold;
  }

  .answer:hover,
  .answer:focus-visible {
    z-index: 2;
    border-color: var(--acid);
    outline: none;
    background: linear-gradient(135deg, rgba(55, 103, 87, .97), rgba(13, 42, 37, .99));
    transform: translate(-3px, -3px);
    box-shadow: 8px 8px 0 #020807, 0 0 17px rgba(217,255,87,.18);
  }

  .answer:active {
    transform: translate(1px, 1px) scale(.985);
  }

  .answer.selected {
    border-color: var(--acid);
    background: linear-gradient(135deg, rgba(104, 138, 54, .72), rgba(18, 59, 46, .98));
    animation: filed .28s ease both;
  }

  .answer.selected::after {
    content: "FILED";
    position: absolute;
    right: 10px;
    bottom: 9px;
    padding: 2px 5px;
    border: 2px solid var(--acid);
    color: var(--acid);
    font-size: 9px;
    font-weight: bold;
    letter-spacing: .1em;
    transform: rotate(-8deg);
  }

  .answer-text {
    display: block;
    font-size: clamp(14px, 2.65vw, 19px);
    line-height: 1.2;
    letter-spacing: -.025em;
  }

  @keyframes filed {
    0% {
      transform: scale(1);
    }

    35% {
      transform: translate(-3px, 2px) rotate(-.8deg);
    }

    70% {
      transform: translate(3px, -2px) rotate(.8deg);
    }

    100% {
      transform: scale(1);
    }
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 32px);
    opacity: 0;
    pointer-events: none;
    background: rgba(2, 11, 10, .88);
    backdrop-filter: blur(4px);
    transition: opacity .22s ease;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .result-card {
    width: min(620px, 100%);
    padding: clamp(27px, 7vw, 60px);
    border: 2px solid var(--acid);
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
      #102321;
    box-shadow: 10px 10px 0 #020807, 0 0 38px rgba(217,255,87,.13);
    text-align: center;
  }

  #result {
    margin: 0 0 clamp(25px, 5vw, 38px);
    color: #f4fff9;
    font-size: clamp(31px, 8vw, 60px);
    line-height: .94;
    letter-spacing: -.08em;
    text-transform: uppercase;
  }

  #restartBtn {
    min-height: 54px;
    padding: 12px 23px;
    border: 1px solid var(--acid);
    color: #102310;
    background: var(--acid);
    font-weight: bold;
    letter-spacing: .1em;
  }

  #restartBtn:hover,
  #restartBtn:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 4px;
    filter: brightness(1.12);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 560px) {
    .quiz-shell {
      padding: 12px;
    }

    .answer-grid {
      grid-template-columns: 1fr;
      gap: 9px;
    }

    .answer {
      min-height: clamp(76px, 13vh, 102px);
    }

    .question-card {
      min-height: 0;
    }
  }

  @media (max-width: 560px) and (max-height: 620px) {
    .quiz-shell {
      display: block;
      padding:
        max(8px, env(safe-area-inset-top))
        12px
        max(14px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scroll-padding-block: 8px;
    }

    .quiz {
      min-height: 100%;
      margin: 0 auto;
      padding: 8px 0;
      gap: 8px;
      align-content: start;
    }

    .how-to {
      font-size: 10px;
      line-height: 1.25;
    }

    .question-card {
      padding: 14px 16px;
    }

    #question {
      font-size: clamp(20px, 6vw, 28px);
      line-height: 1.08;
    }

    .answer-grid {
      gap: 7px;
    }

    .answer {
      min-height: 76px;
      padding: 13px 12px 13px 43px;
    }

    .answer::before {
      top: 12px;
      left: 12px;
      width: 21px;
      height: 21px;
    }

    .answer-text {
      font-size: 14px;
    }

    .overlay {
      position: fixed;
      overflow-y: auto;
      align-items: start;
      padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom));
    }

    .result-card {
      margin: auto;
      padding: 26px 20px;
    }
  }

  @media (max-height: 620px) and (min-width: 561px) {
    .quiz {
      gap: 12px;
    }

    .question-card {
      min-height: 104px;
      padding: 20px 28px;
    }

    .answer {
      min-height: 76px;
      padding-top: 15px;
      padding-bottom: 15px;
    }
  }
</style>
</head>
<body>
<div id="app">
  <main class="quiz-shell" aria-label="Which X-Files character are you quiz">
    <section class="quiz" aria-describedby="howTo">
      <p id="howTo" class="how-to">How to play: choose one answer at a time. Tap a choice or press keys 1–4.</p>
      <div class="question-card">
        <h1 id="question" aria-live="polite"></h1>
      </div>
      <div id="answers" class="answer-grid" aria-label="Answer choices"></div>
    </section>

    <section id="overlay" class="overlay" aria-live="assertive" aria-label="Quiz result">
      <div class="result-card">
        <h2 id="result"></h2>
        <button id="restartBtn" type="button">RESTART QUIZ</button>
      </div>
    </section>

    <section class="sr-only" aria-label="Quiz score and character profile HUD">
      <span id="scoreHud">Score: 0</span>
      <span id="streakHud">Streak: 0</span>
      <span id="mulderHud">Mulder: 0</span>
      <span id="scullyHud">Scully: 0</span>
      <span id="skinnerHud">Skinner: 0</span>
      <span id="gunmenHud">Lone Gunmen: 0</span>
    </section>
  </main>
</div>

<script>
(() => {
  const questions = [
    {
      text: "A light appears over a silent field after midnight. What do you do?",
      answers: [
        ["Mulder", "Follow it before anyone can explain it away."],
        ["Scully", "Document it, test it, and look for a rational cause."],
        ["Skinner", "Secure the area and call in the proper people."],
        ["Gunmen", "Record the signal and trace its frequency."]
      ]
    },
    {
      text: "A witness says they were taken aboard a craft in the woods.",
      answers: [
        ["Mulder", "Believe them and ask what they remember."],
        ["Scully", "Ask for medical evidence and a complete timeline."],
        ["Skinner", "Protect the witness and contain the situation."],
        ["Gunmen", "Search for classified projects near the site."]
      ]
    },
    {
      text: "Your partner disappears while investigating a government file.",
      answers: [
        ["Mulder", "Ignore orders and go after them immediately."],
        ["Scully", "Reconstruct every clue before making a move."],
        ["Skinner", "Use every official channel to bring them back."],
        ["Gunmen", "Break into the system and find the hidden trail."]
      ]
    },
    {
      text: "A case report contradicts every known law of science.",
      answers: [
        ["Mulder", "That makes it worth pursuing."],
        ["Scully", "That makes it worth testing."],
        ["Skinner", "That makes it a risk to the entire bureau."],
        ["Gunmen", "That makes it a perfect conspiracy lead."]
      ]
    },
    {
      text: "Someone offers you a classified file with no explanation.",
      answers: [
        ["Mulder", "Take it. The truth is in there."],
        ["Scully", "Verify the source before trusting a page."],
        ["Skinner", "Assess the consequences before opening it."],
        ["Gunmen", "Copy it, encrypt it, and share it carefully."]
      ]
    },
    {
      text: "A strange signal interrupts every radio in the city.",
      answers: [
        ["Mulder", "Listen for a message meant for you."],
        ["Scully", "Analyze the waveform and rule out interference."],
        ["Skinner", "Coordinate a response before panic spreads."],
        ["Gunmen", "Build an antenna and answer it."]
      ]
    },
    {
      text: "You find a clue that everyone else says is impossible.",
      answers: [
        ["Mulder", "Trust the clue."],
        ["Scully", "Challenge the conclusion."],
        ["Skinner", "Consider what acting on it could cost."],
        ["Gunmen", "Connect it to every hidden pattern you know."]
      ]
    },
    {
      text: "The truth could change everything, but proving it is dangerous.",
      answers: [
        ["Mulder", "Pursue it anyway."],
        ["Scully", "Prove it beyond doubt."],
        ["Skinner", "Protect the people caught in the middle."],
        ["Gunmen", "Expose it before it disappears."]
      ]
    }
  ];

  const profiles = {
    Mulder: "FOX MULDER",
    Scully: "DANA SCULLY",
    Skinner: "WALTER SKINNER",
    Gunmen: "THE LONE GUNMEN"
  };

  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const overlay = document.getElementById("overlay");
  const resultEl = document.getElementById("result");
  const restartBtn = document.getElementById("restartBtn");

  const hud = {
    score: document.getElementById("scoreHud"),
    streak: document.getElementById("streakHud"),
    Mulder: document.getElementById("mulderHud"),
    Scully: document.getElementById("scullyHud"),
    Skinner: document.getElementById("skinnerHud"),
    Gunmen: document.getElementById("gunmenHud")
  };

  let index = 0;
  let score = 0;
  let streak = 0;
  let chosenHistory = [];
  let traits = {};
  let state = "question";

  function shuffle(items) {
    const copy = [...items];

    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
  }

  function updateHud() {
    hud.score.textContent = `Score: ${score}`;
    hud.streak.textContent = `Streak: ${streak}`;
    hud.Mulder.textContent = `Mulder: ${traits.Mulder}`;
    hud.Scully.textContent = `Scully: ${traits.Scully}`;
    hud.Skinner.textContent = `Skinner: ${traits.Skinner}`;
    hud.Gunmen.textContent = `Lone Gunmen: ${traits.Gunmen}`;
  }

  function startQuiz() {
    index = 0;
    score = 0;
    streak = 0;
    chosenHistory = [];
    traits = {
      Mulder: 0,
      Scully: 0,
      Skinner: 0,
      Gunmen: 0
    };
    state = "question";
    overlay.classList.remove("visible");
    updateHud();
    renderQuestion();
  }

  function renderQuestion() {
    const current = questions[index];
    const choices = shuffle(current.answers);

    questionEl.textContent = current.text;
    answersEl.innerHTML = "";

    choices.forEach((choice, choiceIndex) => {
      const [trait, text] = choice;
      const button = document.createElement("button");
      const answerText = document.createElement("span");

      button.type = "button";
      button.className = "answer";
      button.dataset.key = String(choiceIndex + 1);
      button.dataset.trait = trait;

      answerText.className = "answer-text";
      answerText.textContent = text;

      button.appendChild(answerText);
      button.addEventListener("click", () => chooseAnswer(button, trait));
      answersEl.appendChild(button);
    });
  }

  function chooseAnswer(button, trait) {
    if (state !== "question") {
      return;
    }

    state = "transition";
    score += 20 + Math.min(streak * 3, 18);
    streak += 1;
    traits[trait] += 2;
    chosenHistory.push(trait);
    updateHud();

    [...answersEl.children].forEach((answer) => {
      answer.disabled = true;

      if (answer !== button) {
        answer.style.opacity = ".45";
      }
    });

    button.classList.add("selected");

    index += 1;

    if (index >= questions.length) {
      showResult();
    } else {
      state = "question";
      renderQuestion();
    }
  }

  function getWinner() {
    const highest = Math.max(...Object.values(traits));
    const tied = Object.keys(traits).filter((trait) => traits[trait] === highest);

    for (let i = chosenHistory.length - 1; i >= 0; i -= 1) {
      if (tied.includes(chosenHistory[i])) {
        return chosenHistory[i];
      }
    }

    return tied[0];
  }

  function showResult() {
    state = "result";
    resultEl.textContent = profiles[getWinner()];
    overlay.classList.add("visible");
    restartBtn.focus({ preventScroll: true });
  }

  restartBtn.addEventListener("click", startQuiz);

  document.addEventListener("keydown", (event) => {
    if (event.repeat) {
      return;
    }

    if (state === "result" && event.key === "Enter") {
      event.preventDefault();
      startQuiz();
      return;
    }

    if (state === "question" && /^[1-4]$/.test(event.key)) {
      event.preventDefault();
      const answer = answersEl.children[Number(event.key) - 1];

      if (answer) {
        answer.click();
      }
    }
  });

  startQuiz();
})();
</script>
</body>
</html>
