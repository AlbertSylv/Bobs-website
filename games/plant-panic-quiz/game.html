<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plant Panic Quiz</title>
<style>
:root {
  --ink: #173526;
  --cream: #fff9df;
  --card: rgba(255, 253, 235, .97);
  --lime: #b8e86d;
  --danger: #d64f62;
  --warning: #ed9c3d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  overflow: auto;
  font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 15%, rgba(255,255,255,.5) 0 3%, transparent 3.5%),
    radial-gradient(circle at 86% 18%, rgba(255,255,255,.45) 0 2%, transparent 2.5%),
    linear-gradient(145deg, #d7f4a7, #87ce8d 48%, #55a777);
}
button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.game {
  width: 100%;
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: clamp(8px, 2vw, 22px);
}
.panel {
  width: min(760px, 100%);
  padding: clamp(14px, 4vw, 34px);
  background: var(--card);
  border: 4px solid rgba(23, 53, 38, .9);
  border-radius: 24px;
  box-shadow: 0 10px 0 rgba(23, 53, 38, .22), 0 20px 38px rgba(13, 73, 43, .28);
}
.hud {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.hud-item {
  min-width: 0;
  padding: 8px 7px;
  text-align: center;
  background: #e8f8c8;
  border: 2px solid #315d3d;
  border-radius: 12px;
  line-height: 1.05;
}
.hud-label {
  display: block;
  font-size: clamp(10px, 2.4vw, 13px);
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.hud-value {
  display: block;
  margin-top: 3px;
  font-size: clamp(17px, 4vw, 24px);
  font-weight: 900;
}
.tokens-value { color: #7a4a14; }
.timer-section {
  margin: 0 0 clamp(12px, 3vw, 20px);
}
.timer-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 5px;
  font-size: clamp(13px, 3vw, 16px);
  font-weight: 900;
}
.timer-text {
  font-variant-numeric: tabular-nums;
  color: #234832;
}
.timer-bar {
  height: 16px;
  overflow: hidden;
  background: #d8e5cc;
  border: 2px solid #315d3d;
  border-radius: 999px;
}
.timer-fill {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #74c855, #c8eb63);
  border-radius: inherit;
  transition: width .1s linear, background .15s;
}
.timer-bar.warning .timer-fill {
  background: linear-gradient(90deg, #ed9c3d, #ffd45c);
}
.timer-bar.danger .timer-fill {
  background: linear-gradient(90deg, #d64f62, #ff8a87);
}
.how-to {
  margin: 0 0 9px;
  text-align: center;
  font-size: clamp(12px, 2.9vw, 15px);
  font-weight: bold;
  line-height: 1.25;
}
.feedback {
  min-height: 1.45em;
  margin: 0 0 9px;
  padding: 4px 9px;
  text-align: center;
  border-radius: 9px;
  font-size: clamp(13px, 3vw, 16px);
  font-weight: 900;
  line-height: 1.25;
}
.feedback:empty {
  visibility: hidden;
}
.feedback.good {
  color: #195c2b;
  background: #dff5c7;
}
.feedback.bad {
  color: #8a2236;
  background: #ffdce0;
}
.question {
  margin: 0 0 clamp(12px, 3vw, 20px);
  text-align: center;
  font-size: clamp(22px, 5.2vw, 40px);
  font-weight: 900;
  line-height: 1.13;
  letter-spacing: -.5px;
}
.answers {
  display: grid;
  gap: clamp(8px, 2vw, 14px);
}
.answer {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  padding: 9px 13px;
  border: 3px solid #315d3d;
  border-radius: 16px;
  background: #fffef5;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  font-size: clamp(14px, 3.7vw, 20px);
  font-weight: bold;
  line-height: 1.15;
  box-shadow: 0 4px 0 #315d3d;
  transition: transform .12s, background .12s, box-shadow .12s;
}
.answer:hover,
.answer:focus-visible {
  background: #e5f9bd;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #315d3d;
  outline: none;
}
.answer:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #315d3d;
}
.answer[disabled] { cursor: default; }
.answer.correct {
  background: #a9e77e;
  border-color: #337940;
}
.answer.wrong {
  background: #ffb6bd;
  border-color: #b34a5e;
}
.key {
  display: inline-grid;
  place-items: center;
  width: 29px;
  height: 29px;
  flex: 0 0 29px;
  margin-right: 11px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--cream);
  font-size: 14px;
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: auto;
  background: rgba(23, 53, 38, .72);
}
.overlay.show { display: flex; }
.result-card {
  width: min(430px, 100%);
  padding: 28px 22px 23px;
  text-align: center;
  background: var(--cream);
  border: 4px solid var(--ink);
  border-radius: 25px;
  box-shadow: 0 9px 0 rgba(0, 0, 0, .22);
}
.result-card h2 {
  margin: 0 0 10px;
  font-size: clamp(27px, 7vw, 39px);
}
.result-card p {
  margin: 0 0 20px;
  font-size: 16px;
  line-height: 1.35;
}
.restart {
  min-height: 48px;
  padding: 10px 22px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: var(--lime);
  color: var(--ink);
  cursor: pointer;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 4px 0 var(--ink);
}
.restart:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--ink);
}
@media (max-height: 560px) {
  .game {
    display: block;
    padding: 7px;
  }
  .panel {
    margin: 0 auto;
    padding: 12px;
    border-width: 3px;
    border-radius: 18px;
  }
  .hud {
    gap: 6px;
    margin-bottom: 8px;
  }
  .hud-item { padding: 5px 4px; }
  .timer-section { margin-bottom: 8px; }
  .timer-bar { height: 13px; }
  .how-to { margin-bottom: 5px; }
  .feedback { margin-bottom: 5px; }
  .question {
    margin-bottom: 9px;
    font-size: clamp(19px, 4.8vw, 30px);
  }
  .answers { gap: 7px; }
  .answer {
    min-height: 44px;
    padding: 7px 9px;
    border-width: 2px;
    border-radius: 12px;
  }
  .key {
    width: 24px;
    height: 24px;
    flex-basis: 24px;
    margin-right: 8px;
    border-radius: 6px;
    font-size: 12px;
  }
}
</style>
</head>
<body>
<div class="game">
  <section class="panel" aria-label="Plant Panic Quiz game">
    <div class="hud" aria-label="Game status">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Round</span>
        <span class="hud-value"><span id="round">1</span>/10</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Compost tokens</span>
        <span class="hud-value tokens-value"><span id="tokens">3</span> ♻</span>
      </div>
    </div>

    <div class="timer-section" aria-label="Time remaining">
      <div class="timer-row">
        <span>Watering window</span>
        <span><span id="timerText">9.0</span> seconds</span>
      </div>
      <div class="timer-bar" id="timerArea" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="9" aria-valuenow="9">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </div>

    <p class="how-to">How to play: tap an answer or press 1, 2, or 3. Wrong answers and timeouts cost a compost token.</p>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="question" id="question" aria-live="polite"></div>
    <div class="answers" id="answers"></div>
  </section>
</div>

<div class="overlay" id="overlay" aria-live="assertive" aria-modal="true" role="dialog" aria-labelledby="resultTitle">
  <div class="result-card">
    <h2 id="resultTitle">Sunlight Certified!</h2>
    <p id="resultText"></p>
    <button class="restart" id="restart" type="button">Pot Another Round</button>
  </div>
</div>

<script>
(() => {
  const questions = [
    { q: "Your monstera starts paying rent. What does it demand first?", a: ["A bigger pot and voting rights", "A tiny landlord hat", "Access to your streaming password"], correct: 0 },
    { q: "What is the most respectful way to greet a cactus?", a: ["A firm handshake", "A respectful nod from a safe distance", "A high-five with confidence"], correct: 1 },
    { q: "A basil plant is judging your cooking. Why?", a: ["You called pesto 'green sauce'", "It can smell fear", "You used a measuring cup"], correct: 0 },
    { q: "Your fern wants a job. Which role is it born to perform?", a: ["Tax auditor", "Moisture consultant", "Volcano lifeguard"], correct: 1 },
    { q: "What should you say when a houseplant compliments your outfit?", a: ["'Thanks, I grew it myself.'", "'Leaf me alone.'", "'You look radiant too.'"], correct: 2 },
    { q: "A succulent has gone missing. Where is it most likely hiding?", a: ["In a drawer, avoiding responsibility", "On the brightest windowsill, smugly", "Under the sofa training for darkness"], correct: 1 },
    { q: "Which snack would a dramatic orchid request?", a: ["A single dewdrop served in crystal", "Nachos with extra jalapeños", "A sensible granola bar"], correct: 0 },
    { q: "Your aloe says it needs space. What does it actually mean?", a: ["'Move me away from the radiator.'", "'I am starting a band.'", "'Please stop using me as a TV remote stand.'"], correct: 2 },
    { q: "A plant sends you a calendar invite titled 'Misting.' What do you do?", a: ["Accept, then bring a tiny umbrella", "Decline and move countries", "Reply all with a potato recipe"], correct: 0 },
    { q: "What is the official sound of a plant being proud of you?", a: ["'Photosyn-thanks!'", "A faint rustle of approval", "A trumpet solo from the soil"], correct: 1 }
  ];

  const scoreEl = document.getElementById("score");
  const roundEl = document.getElementById("round");
  const tokensEl = document.getElementById("tokens");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const timerAreaEl = document.getElementById("timerArea");
  const timerTextEl = document.getElementById("timerText");
  const timerFillEl = document.getElementById("timerFill");
  const overlayEl = document.getElementById("overlay");
  const resultTitleEl = document.getElementById("resultTitle");
  const resultTextEl = document.getElementById("resultText");
  const restartEl = document.getElementById("restart");

  const timeLimit = 9000;
  let score = 0;
  let tokens = 3;
  let index = 0;
  let locked = false;
  let startedAt = 0;
  let timerId = null;
  let timerDisplayId = null;
  let order = [];

  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function clearTimer() {
    clearTimeout(timerId);
    clearInterval(timerDisplayId);
    timerId = null;
    timerDisplayId = null;
  }

  function setFeedback(message, type) {
    feedbackEl.textContent = message;
    feedbackEl.className = "feedback" + (type ? " " + type : "");
  }

  function updateTimerDisplay() {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, timeLimit - elapsed);
    const seconds = remaining / 1000;
    const percent = (remaining / timeLimit) * 100;

    timerTextEl.textContent = seconds.toFixed(1);
    timerFillEl.style.width = percent + "%";
    timerAreaEl.setAttribute("aria-valuenow", seconds.toFixed(1));
    timerAreaEl.classList.toggle("warning", remaining <= 4000 && remaining > 2000);
    timerAreaEl.classList.toggle("danger", remaining <= 2000);
  }

  function runTimer() {
    clearTimer();
    startedAt = Date.now();
    updateTimerDisplay();
    timerDisplayId = setInterval(updateTimerDisplay, 100);
    timerId = setTimeout(() => {
      if (!locked) {
        updateTimerDisplay();
        answer(-1, true);
      }
    }, timeLimit);
  }

  function showQuestion() {
    locked = false;
    const item = questions[order[index]];
    roundEl.textContent = index + 1;
    questionEl.textContent = item.q;
    setFeedback("", "");
    answersEl.innerHTML = "";

    item.a.forEach((text, i) => {
      const button = document.createElement("button");
      const key = document.createElement("span");
      const label = document.createElement("span");

      button.className = "answer";
      button.type = "button";
      button.setAttribute("aria-label", "Answer " + (i + 1) + ": " + text);
      key.className = "key";
      key.textContent = i + 1;
      label.textContent = text;

      button.appendChild(key);
      button.appendChild(label);
      button.addEventListener("click", () => answer(i, false));
      answersEl.appendChild(button);
    });

    runTimer();
  }

  function answer(choice, timedOut) {
    if (locked) return;

    locked = true;
    const elapsed = Date.now() - startedAt;
    clearTimer();

    const item = questions[order[index]];
    const buttons = Array.from(answersEl.querySelectorAll(".answer"));
    const isCorrect = choice === item.correct;

    buttons.forEach((button, i) => {
      button.disabled = true;
      if (i === item.correct) button.classList.add("correct");
      if (choice === i && !isCorrect) button.classList.add("wrong");
    });

    if (isCorrect) {
      const speedBonus = Math.max(0, Math.round((timeLimit - Math.min(elapsed, timeLimit)) / 90));
      score += 100 + speedBonus;
      scoreEl.textContent = score;
      setFeedback("Correct! Your plant approves.", "good");
    } else {
      tokens--;
      tokensEl.textContent = tokens;
      setFeedback(timedOut ? "Time ran out! A compost token was used." : "Not quite! A compost token was used.", "bad");
    }

    setTimeout(() => {
      if (tokens <= 0) {
        endGame(false);
      } else if (index >= questions.length - 1) {
        endGame(true);
      } else {
        index++;
        showQuestion();
      }
    }, 900);
  }

  function endGame(won) {
    clearTimer();
    overlayEl.classList.add("show");

    if (won) {
      resultTitleEl.textContent = "Sunlight Certified!";
      resultTextEl.textContent = "You finished all 10 rounds with " + score + " points and " + tokens + " compost token" + (tokens === 1 ? "" : "s") + " left.";
    } else {
      resultTitleEl.textContent = "Compost Court Adjourned";
      resultTextEl.textContent = "Your compost tokens are gone. Final score: " + score + " points.";
    }

    restartEl.focus();
  }

  function resetGame() {
    clearTimer();
    score = 0;
    tokens = 3;
    index = 0;
    locked = false;
    order = shuffle(questions.map((_, i) => i));
    scoreEl.textContent = "0";
    tokensEl.textContent = "3";
    roundEl.textContent = "1";
    overlayEl.classList.remove("show");
    showQuestion();
  }

  document.addEventListener("keydown", (event) => {
    if (overlayEl.classList.contains("show")) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        resetGame();
      }
      return;
    }

    if (event.key >= "1" && event.key <= "3" && !locked) {
      event.preventDefault();
      answer(Number(event.key) - 1, false);
    }
  });

  restartEl.addEventListener("click", resetGame);
  resetGame();
})();
</script>
</body>
</html>
