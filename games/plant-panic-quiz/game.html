<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plant Panic Quiz</title>
<style>
  :root {
    --ink: #173526;
    --lime: #b8e86d;
    --cream: #fff9df;
    --card: rgba(255, 253, 235, 0.97);
    --danger: #c84b5d;
    --warning: #e18b28;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
  }

  body {
    overflow: hidden;
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 15%, rgba(255,255,255,.5) 0 3%, transparent 3.5%),
      radial-gradient(circle at 86% 18%, rgba(255,255,255,.45) 0 2%, transparent 2.5%),
      linear-gradient(145deg, #d7f4a7, #87ce8d 48%, #55a777);
  }

  button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .game {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: clamp(10px, 2.5vw, 28px);
  }

  .panel {
    width: min(760px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: clamp(16px, 4.5vw, 42px);
    background: var(--card);
    border: 4px solid rgba(23, 53, 38, .9);
    border-radius: 28px;
    box-shadow: 0 12px 0 rgba(23, 53, 38, .22), 0 22px 42px rgba(13, 73, 43, .28);
  }

  .game-title {
    margin: 0 0 12px;
    text-align: center;
    font-size: clamp(20px, 4vw, 29px);
    line-height: 1;
    font-weight: 900;
  }

  .hud {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 13px;
  }

  .hud-item {
    min-width: 0;
    padding: 9px 7px;
    border: 2px solid #315d3d;
    border-radius: 13px;
    background: #edf9cc;
    text-align: center;
  }

  .hud-label {
    display: block;
    font-size: clamp(10px, 2.3vw, 12px);
    font-weight: 900;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .hud-value {
    display: block;
    margin-top: 2px;
    font-size: clamp(18px, 4vw, 25px);
    font-weight: 900;
    line-height: 1;
  }

  .timer-area {
    margin-bottom: clamp(13px, 2.5vw, 20px);
    padding: 10px 12px;
    border: 2px solid #315d3d;
    border-radius: 14px;
    background: #fffef5;
  }

  .timer-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    font-weight: 900;
  }

  .timer-heading strong {
    font-size: 19px;
  }

  .timer-bar {
    height: 12px;
    margin-top: 7px;
    overflow: hidden;
    border-radius: 99px;
    background: #d8e7c5;
  }

  .timer-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #65b957, #b8e86d);
    transition: width .1s linear, background .15s;
  }

  .timer-area.warning {
    border-color: var(--warning);
    background: #fff4d6;
  }

  .timer-area.warning .timer-fill {
    background: linear-gradient(90deg, #f2bd3d, #e58a27);
  }

  .timer-area.danger {
    border-color: var(--danger);
    background: #ffe3e5;
    animation: pulse .65s infinite alternate;
  }

  .timer-area.danger .timer-fill {
    background: linear-gradient(90deg, #ef7c67, #c84b5d);
  }

  @keyframes pulse {
    from { box-shadow: 0 0 0 rgba(200, 75, 93, 0); }
    to { box-shadow: 0 0 0 4px rgba(200, 75, 93, .18); }
  }

  .how-to-play {
    margin: 0 0 clamp(14px, 3vw, 22px);
    text-align: center;
    font-size: clamp(13px, 2.8vw, 16px);
    font-weight: bold;
    line-height: 1.3;
  }

  .question {
    margin: 0 0 clamp(16px, 3vw, 25px);
    font-size: clamp(23px, 5.2vw, 40px);
    line-height: 1.14;
    font-weight: 900;
    letter-spacing: -.5px;
    text-align: center;
  }

  .answers {
    display: grid;
    gap: clamp(9px, 2vw, 15px);
  }

  .answer {
    width: 100%;
    min-height: clamp(52px, 10vw, 68px);
    display: flex;
    align-items: center;
    text-align: left;
    padding: 10px 14px;
    border: 3px solid #315d3d;
    border-radius: 16px;
    background: #fffef5;
    color: var(--ink);
    cursor: pointer;
    font-size: clamp(15px, 3.7vw, 20px);
    font-weight: bold;
    line-height: 1.18;
    box-shadow: 0 4px 0 #315d3d;
    transition: transform .12s, background .12s, box-shadow .12s;
  }

  .answer:hover,
  .answer:focus-visible {
    background: #e5f9bd;
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #315d3d;
    outline: none;
  }

  .answer:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #315d3d;
  }

  .answer[disabled] {
    cursor: default;
  }

  .answer.correct {
    background: #a9e77e;
    border-color: #337940;
  }

  .answer.wrong {
    background: #ffb6bd;
    border-color: #b34a5e;
  }

  .key {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    margin-right: 12px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--cream);
    font-size: 15px;
  }

  .feedback {
    min-height: 20px;
    margin: 12px 0 0;
    text-align: center;
    color: #315d3d;
    font-size: 14px;
    font-weight: 900;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(23, 53, 38, .72);
  }

  .overlay.show {
    display: flex;
  }

  .result-card {
    width: min(430px, 100%);
    padding: 28px 22px 23px;
    text-align: center;
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 25px;
    box-shadow: 0 9px 0 rgba(0, 0, 0, .22);
  }

  .result-card h2 {
    margin: 0 0 10px;
    font-size: clamp(27px, 7vw, 39px);
  }

  .result-card p {
    margin: 0 0 20px;
    line-height: 1.35;
    font-size: 16px;
  }

  .restart {
    min-height: 46px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: var(--lime);
    color: var(--ink);
    padding: 10px 22px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 4px 0 var(--ink);
  }

  .restart:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-height: 560px) {
    .panel {
      padding: 14px 18px;
      border-radius: 20px;
    }

    .game-title {
      margin-bottom: 8px;
    }

    .hud {
      margin-bottom: 8px;
    }

    .hud-item {
      padding: 6px;
    }

    .timer-area {
      padding: 7px 10px;
      margin-bottom: 8px;
    }

    .timer-bar {
      height: 8px;
      margin-top: 4px;
    }

    .how-to-play {
      margin-bottom: 9px;
    }

    .question {
      margin-bottom: 10px;
      font-size: clamp(20px, 4.8vw, 30px);
    }

    .answers {
      gap: 8px;
    }

    .answer {
      min-height: 43px;
      padding: 6px 10px;
    }

    .key {
      width: 25px;
      height: 25px;
      flex-basis: 25px;
      margin-right: 9px;
      border-radius: 6px;
      font-size: 13px;
    }

    .feedback {
      margin-top: 7px;
    }
  }
</style>
</head>
<body>
<div class="game">
  <section class="panel" aria-label="Plant Panic Quiz game">
    <h1 class="game-title">Plant Panic Quiz</h1>

    <div class="hud" aria-label="Game status">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Round</span>
        <span class="hud-value"><span id="round">1</span>/10</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Compost tokens</span>
        <span class="hud-value" id="tokens">3</span>
      </div>
    </div>

    <div class="timer-area" id="timerArea" aria-label="Answer timer">
      <div class="timer-heading">
        <span>Answer before time runs out!</span>
        <strong><span id="timerText">9.0</span>s</strong>
      </div>
      <div class="timer-bar" aria-hidden="true">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </div>

    <p class="how-to-play">How to play: tap an answer or press 1, 2, or 3. You have 9 seconds per question; a wrong or timed-out answer costs one compost token.</p>

    <div class="question" id="question" aria-live="polite"></div>
    <div class="answers" id="answers"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </section>
</div>

<div class="overlay" id="overlay" aria-live="assertive" aria-modal="true" role="dialog" aria-labelledby="resultTitle">
  <div class="result-card">
    <h2 id="resultTitle">Sunlight Certified!</h2>
    <p id="resultText"></p>
    <button class="restart" id="restart" type="button">Pot Another Round</button>
  </div>
</div>

<script>
(() => {
  const questions = [
    { q: "Your monstera starts paying rent. What does it demand first?", a: ["A bigger pot and voting rights", "A tiny landlord hat", "Access to your streaming password"], correct: 0 },
    { q: "What is the most respectful way to greet a cactus?", a: ["A firm handshake", "A respectful nod from a safe distance", "A high-five with confidence"], correct: 1 },
    { q: "A basil plant is judging your cooking. Why?", a: ["You called pesto 'green sauce'", "It can smell fear", "You used a measuring cup"], correct: 0 },
    { q: "Your fern wants a job. Which role is it born to perform?", a: ["Tax auditor", "Moisture consultant", "Volcano lifeguard"], correct: 1 },
    { q: "What should you say when a houseplant compliments your outfit?", a: ["'Thanks, I grew it myself.'", "'Leaf me alone.'", "'You look radiant too.'"], correct: 2 },
    { q: "A succulent has gone missing. Where is it most likely hiding?", a: ["In a drawer, avoiding responsibility", "On the brightest windowsill, smugly", "Under the sofa training for darkness"], correct: 1 },
    { q: "Which snack would a dramatic orchid request?", a: ["A single dewdrop served in crystal", "Nachos with extra jalapeños", "A sensible granola bar"], correct: 0 },
    { q: "Your aloe says it needs space. What does it actually mean?", a: ["'Move me away from the radiator.'", "'I am starting a band.'", "'Please stop using me as a TV remote stand.'"], correct: 2 },
    { q: "A plant sends you a calendar invite titled 'Misting.' What do you do?", a: ["Accept, then bring a tiny umbrella", "Decline and move countries", "Reply all with a potato recipe"], correct: 0 },
    { q: "What is the official sound of a plant being proud of you?", a: ["'Photosyn-thanks!'", "A faint rustle of approval", "A trumpet solo from the soil"], correct: 1 }
  ];

  const scoreEl = document.getElementById("score");
  const roundEl = document.getElementById("round");
  const tokensEl = document.getElementById("tokens");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const timerAreaEl = document.getElementById("timerArea");
  const timerTextEl = document.getElementById("timerText");
  const timerFillEl = document.getElementById("timerFill");
  const overlayEl = document.getElementById("overlay");
  const resultTitleEl = document.getElementById("resultTitle");
  const resultTextEl = document.getElementById("resultText");
  const restartEl = document.getElementById("restart");

  const timeLimit = 9000;
  let score = 0;
  let tokens = 3;
  let index = 0;
  let locked = false;
  let startedAt = 0;
  let timerId = null;
  let timerDisplayId = null;
  let order = [];

  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function clearTimer() {
    clearTimeout(timerId);
    clearInterval(timerDisplayId);
    timerId = null;
    timerDisplayId = null;
  }

  function updateTimerDisplay() {
    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, timeLimit - elapsed);
    const percentage = (remaining / timeLimit) * 100;

    timerTextEl.textContent = (remaining / 1000).toFixed(1);
    timerFillEl.style.width = percentage + "%";
    timerAreaEl.classList.toggle("warning", remaining <= 5000 && remaining > 2500);
    timerAreaEl.classList.toggle("danger", remaining <= 2500);
  }

  function runTimer() {
    clearTimer();
    startedAt = Date.now();
    updateTimerDisplay();

    timerDisplayId = setInterval(updateTimerDisplay, 100);
    timerId = setTimeout(() => {
      if (!locked) {
        updateTimerDisplay();
        answer(-1, true);
      }
    }, timeLimit);
  }

  function showQuestion() {
    locked = false;
    const item = questions[order[index]];

    roundEl.textContent = index + 1;
    questionEl.textContent = item.q;
    feedbackEl.textContent = "";
    answersEl.innerHTML = "";

    item.a.forEach((text, i) => {
      const button = document.createElement("button");
      const key = document.createElement("span");
      const label = document.createElement("span");

      button.className = "answer";
      button.type = "button";
      button.setAttribute("aria-label", "Answer " + (i + 1) + ": " + text);

      key.className = "key";
      key.textContent = i + 1;
      label.textContent = text;

      button.appendChild(key);
      button.appendChild(label);
      button.addEventListener("click", () => answer(i, false));
      answersEl.appendChild(button);
    });

    runTimer();
  }

  function answer(choice, timedOut) {
    if (locked) {
      return;
    }

    locked = true;
    const elapsed = Date.now() - startedAt;
    clearTimer();

    const item = questions[order[index]];
    const buttons = Array.from(answersEl.querySelectorAll(".answer"));
    const isCorrect = choice === item.correct;

    buttons.forEach((button, i) => {
      button.disabled = true;
      if (i === item.correct) {
        button.classList.add("correct");
      }
      if (choice === i && !isCorrect) {
        button.classList.add("wrong");
      }
    });

    if (isCorrect) {
      const speedBonus = Math.max(0, Math.round((timeLimit - Math.min(elapsed, timeLimit)) / 90));
      score += 100 + speedBonus;
      scoreEl.textContent = score;
      feedbackEl.textContent = "Correct! Your plant approves.";
    } else {
      tokens--;
      tokensEl.textContent = tokens;
      feedbackEl.textContent = timedOut
        ? "Time ran out! One compost token was used."
        : "Not quite! One compost token was used.";
    }

    setTimeout(() => {
      if (tokens <= 0) {
        endGame(false);
      } else if (index >= questions.length - 1) {
        endGame(true);
      } else {
        index++;
        showQuestion();
      }
    }, 900);
  }

  function endGame(won) {
    clearTimer();
    overlayEl.classList.add("show");

    if (won) {
      resultTitleEl.textContent = "Sunlight Certified!";
      resultTextEl.textContent = "You finished all 10 rounds with " + score + " points and " + tokens + " compost token" + (tokens === 1 ? "" : "s") + " left.";
    } else {
      resultTitleEl.textContent = "Compost Court Adjourned";
      resultTextEl.textContent = "Your compost tokens are gone. Final score: " + score + " points.";
    }

    restartEl.focus();
  }

  function resetGame() {
    clearTimer();
    score = 0;
    tokens = 3;
    index = 0;
    locked = false;
    order = shuffle(questions.map((_, i) => i));

    scoreEl.textContent = "0";
    tokensEl.textContent = "3";
    roundEl.textContent = "1";
    timerAreaEl.classList.remove("warning", "danger");
    overlayEl.classList.remove("show");
    showQuestion();
  }

  document.addEventListener("keydown", (event) => {
    if (overlayEl.classList.contains("show")) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        resetGame();
      }
      return;
    }

    if (event.key >= "1" && event.key <= "3" && !locked) {
      event.preventDefault();
      answer(Number(event.key) - 1, false);
    }
  });

  restartEl.addEventListener("click", resetGame);
  resetGame();
})();
</script>
</body>
</html>
